name: validate

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 1. actionlint — syntax of workflow files
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. gh workflow lint — GitHub's own reusable-workflow validator
  gh-lint:
    name: gh-workflow-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint every workflow file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          for f in $(find .github/workflows -name '*.yml' -o -name '*.yaml'); do
            echo "::group::lint $f"
            gh workflow lint "$f"
            echo "::endgroup::"
          done

  # 3. yaml-validity for skills, prompts, and any yml
  yaml-validity:
    name: yaml-validity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: YAML parse all files
        run: |
          python3 -c "
          import glob, sys, yaml
          bad = []
          files = glob.glob('**/*.yml', recursive=True) + glob.glob('**/*.yaml', recursive=True)
          for f in files:
              try:
                  yaml.safe_load(open(f))
              except Exception as e:
                  bad.append((f, str(e)))
          if bad:
              for f, e in bad:
                  print(f'BAD: {f}: {e}', file=sys.stderr)
              sys.exit(1)
          print(f'all {len(files)} YAML files OK')
          "

  # 4. js-syntax — node --check on every script
  js-syntax:
    name: js-syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node --check every .js file
        run: |
          find . -name '*.js' -not -path './node_modules/*' -print0 \
            | xargs -0 -I {} node --check {}
