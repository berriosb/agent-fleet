name: validate

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 1. actionlint — syntax of workflow files
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. yaml-validity for skills, prompts, and any yml/yaml
  yaml-validity:
    name: yaml-validity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pyyaml
        run: pip install --quiet pyyaml
      - name: YAML parse all files and skills frontmatter
        shell: bash
        run: |
          python3 -c "
          import glob, sys, yaml, re
          bad = []
          files = set(glob.glob('**/*.yml', recursive=True) + glob.glob('.github/**/*.yml', recursive=True) + glob.glob('**/*.yaml', recursive=True))
          for f in files:
              try:
                  yaml.safe_load(open(f))
              except Exception as e:
                  bad.append((f, str(e)))
          if bad:
              for f, e in bad:
                  print(f'BAD: {f}: {e}', file=sys.stderr)
              sys.exit(1)
          print(f'all {len(files)} YAML files OK')
          "

  # 3. js-syntax — node --check on every script
  js-syntax:
    name: js-syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: node --check every .js file
        shell: bash
        run: |
          find . -name '*.js' -not -path './node_modules/*' -print0 \
            | xargs -0 -I {} node --check {}

  # 4. conventions-sync — verify vault projections match reference
  conventions-sync:
    name: conventions-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check vault conventions synchronization
        shell: bash
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          python3 scripts/sync-conventions.py --check

  # 5. skills-integrity — frontmatter, CJK, fences, patrones duplicados.
  #    Usa el mismo script que scripts/verify.sh: local y CI aplican los mismos
  #    criterios, sin dos implementaciones que puedan divergir.
  skills-integrity:
    name: skills-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validar skills
        run: python3 scripts/check-skills.py

  # 6. gate-roundtrip — el hook de push acepta, consume y bloquea como debe.
  gate-roundtrip:
    name: gate-roundtrip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Round-trip del hook de pre-push
        run: bash scripts/verify-hook.sh

  # 7. install-drift — sin directorios de agente en CI: sale con 0. Falla si el
  #    script deja de tolerar la ausencia de ~/.agents, ~/.claude, etc.
  install-drift:
    name: install-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verificar estado de instalación
        run: python3 scripts/check-install.py

  # 8. runner — el gate de pre-push-qa corrido sobre este repo. Es el paso 4 de
  #    scripts/verify.sh, y el que nunca se ejercitaba en CI: el runner es lo
  #    que usan los repos consumidores, y un fallo suyo no lo detectaba nadie.
  runner:
    name: runner (pre-push-qa sobre el repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - name: Instalar herramientas de Python
        run: pip install --quiet -r requirements-dev.txt
      - name: Round-trip del runner
        run: bash scripts/verify-runner.sh
      - name: Correr el gate sobre el repo
        run: ./skills/pre-push-qa/scripts/run.sh

  # 9. tag-drift — el tag v1 tiene que estar al dia con el runner.
  #
  # Los repos consumidores invocan `qa.yml@v1`, y ese workflow hace checkout
  # del runner en `ref: v1`. Si el tag se queda atras, los arreglos al gate no
  # llegan a los consumidores y el fallo aparece en otro repo, semanas
  # despues. El tag estuvo 13 commits atrasado sin que nada lo dijera.
  #
  # El workflow `release` mueve el tag en paralelo a este. Por eso se ESPERA a
  # que llegue en vez de fallar por la carrera: si el release fallo, el tag no
  # llega y el job falla al expirar la espera.
  #
  # Corre solo en push a main: en un PR el tag todavia no puede incluir el
  # cambio, asi que ahi solo seria ruido.
  tag-drift:
    name: tag-drift (v1)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Esperar a que el tag v1 alcance el runner actual
        shell: bash
        run: |
          set -eo pipefail
          # El tag se compara con el ref local `v1`: `git fetch --tags` deja
          # los tags en refs/tags/, no en refs/remotes/origin/. Con `origin/v1`
          # la comparacion no resuelve y el job espera sin poder pasar nunca.
          for _ in $(seq 1 30); do
            git fetch origin --tags --force -q
            if git rev-parse -q --verify v1 >/dev/null 2>&1 \
              && git diff --quiet v1 HEAD -- skills/pre-push-qa .github/workflows/qa.yml 2>/dev/null; then
              echo "OK: el tag v1 contiene el runner actual ($(git rev-parse --short v1))."
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: el tag v1 no alcanzo el runner actual en 5 minutos." >&2
          echo "  Revisa el workflow 'release' de este run." >&2
          git diff --stat v1 HEAD -- skills/pre-push-qa .github/workflows/qa.yml >&2 || true
          exit 1
