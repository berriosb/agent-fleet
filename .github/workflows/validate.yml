name: validate

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 1. actionlint — syntax of workflow files
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. yaml-validity for skills, prompts, and any yml/yaml
  yaml-validity:
    name: yaml-validity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: YAML parse all files and skills frontmatter
        shell: bash
        run: |
          python3 -c "
          import glob, sys, yaml, re
          bad = []
          files = set(glob.glob('**/*.yml', recursive=True) + glob.glob('.github/**/*.yml', recursive=True) + glob.glob('**/*.yaml', recursive=True))
          for f in files:
              try:
                  yaml.safe_load(open(f))
              except Exception as e:
                  bad.append((f, str(e)))

          skills = glob.glob('skills/**/SKILL.md', recursive=True)
          for s in skills:
              content = open(s).read()
              m = re.match(r'^---\n(.*?)\n---', content, re.DOTALL)
              if not m:
                  bad.append((s, 'Missing YAML frontmatter'))
                  continue
              try:
                  data = yaml.safe_load(m.group(1))
                  if not isinstance(data, dict) or 'name' not in data:
                      bad.append((s, \"Frontmatter missing 'name' field\"))
              except Exception as e:
                  bad.append((s, f'Frontmatter YAML parse error: {e}'))

          if bad:
              for f, e in bad:
                  print(f'BAD: {f}: {e}', file=sys.stderr)
              sys.exit(1)
          print(f'all {len(files)} YAML files and {len(skills)} skills frontmatter OK')
          "

  # 3. js-syntax — node --check on every script
  js-syntax:
    name: js-syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: node --check every .js file
        shell: bash
        run: |
          find . -name '*.js' -not -path './node_modules/*' -print0 \
            | xargs -0 -I {} node --check {}

  # 4. conventions-sync — verify vault projections match reference
  conventions-sync:
    name: conventions-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check vault conventions synchronization
        shell: bash
        run: |
          python3 scripts/sync-conventions.py --check

  # 5. cjk-integrity — ensure 0 CJK glyphs in docs and skills
  cjk-integrity:
    name: cjk-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check CJK glyphs
        shell: bash
        run: |
          python3 -c "
          import glob, sys, re
          files = glob.glob('skills/**/*', recursive=True) + glob.glob('*.md')
          bad = []
          for f in files:
              try:
                  with open(f, 'r', encoding='utf-8') as fp:
                      m = re.findall(r'[\u4e00-\u9fff]', fp.read())
                      if m:
                          bad.append((f, len(m)))
              except Exception:
                  pass
          if bad:
              for f, c in bad:
                  print(f'ERROR: {f} contains {c} CJK glyphs', file=sys.stderr)
              sys.exit(1)
          print('CJK check passed: 0 CJK glyphs found.')
          "
