# gatling — QA reusable workflow.
# This file lives in the central repo (berriosb/pre-push-qa).
# Consumer repos invoke it via:
#   uses: berriosb/pre-push-qa/.github/workflows/qa.yml@v1

name: gatling-qa

on:
  workflow_call:
    inputs:
      stack:
        description: "Detected stack: python | pnpm | npm | mixed | terraform | docs | auto"
        required: false
        type: string
        default: "auto"
      enable_ai_review:
        description: "Run AI PR review (uses MiniMax M3 by default)"
        required: false
        type: boolean
        default: true
      enable_auto_fix:
        description: "Open a fix attempt branch when lint/tests fail (HITL)"
        required: false
        type: boolean
        default: true
      llm_provider:
        description: "Where the AI review runs: minimax (default, your subscription) | anthropic | openai | gemini"
        required: false
        type: string
        default: "minimax"
      skip_if_coderabbit:
        description: "If CodeRabbit has already reviewed, skip the AI review to save tokens"
        required: false
        type: boolean
        default: true
      draft_pr:
        description: "Is this run for a draft PR? (passed via consumer workflow; defaults to false)"
        required: false
        type: boolean
        default: false
    secrets:
      MINIMAX_API_KEY:
        required: false
      MINIMAX_BASE_URL:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      GOOGLE_API_KEY:
        required: false
      CODERABBIT_API_KEY:
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

concurrency:
  group: gatling-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 1. STATIC — lint + typecheck, fast and free.
  static:
    name: lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Detect stack
        id: detect
        shell: bash
        run: |
          set -e
          if [ -f pnpm-lock.yaml ]; then
            echo "stack=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            echo "stack=npm" >> "$GITHUB_OUTPUT"
          elif [ -f uv.lock ] || [ -f pyproject.toml ]; then
            echo "stack=python" >> "$GITHUB_OUTPUT"
          elif compgen -G "*.tf" > /dev/null; then
            echo "stack=terraform" >> "$GITHUB_OUTPUT"
          elif find . -maxdepth 3 -name "*.md" -not -path "./node_modules/*" -print -quit | grep -q .; then
            echo "stack=docs" >> "$GITHUB_OUTPUT"
          else
            echo "stack=mixed" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.detect.outputs.stack == 'pnpm' || steps.detect.outputs.stack == 'npm' || steps.detect.outputs.stack == 'mixed'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Python (uv)
        if: steps.detect.outputs.stack == 'python' || steps.detect.outputs.stack == 'mixed'
        uses: astral-sh/setup-uv@v3

      - name: Run lint
        shell: bash
        run: |
          set +e
          case "${{ steps.detect.outputs.stack }}" in
            pnpm|npm)
              pnpm install --frozen-lockfile --ignore-scripts 2>/dev/null || npm ci --ignore-scripts
              pnpm run lint --if-present || true
              pnpm exec tsc --noEmit --if-present || npx tsc --noEmit --if-present || true
              ;;
            python)
              uv sync --frozen 2>/dev/null || uv sync
              uv run ruff check . --output-format=concise || true
              uv run mypy . --ignore-missing-imports || true
              ;;
            terraform)
              terraform fmt -check -recursive || true
              ;;
            docs) echo "no lint for docs-only change" ;;
            *) echo "no static check for unknown stack" ;;
          esac

  # 2. TESTS — unit/integration, baseline-aware.
  tests:
    name: tests
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup pnpm
        if: needs.static.outputs.stack == 'pnpm' || needs.static.outputs.stack == 'npm' || needs.static.outputs.stack == 'mixed'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Python (uv)
        if: needs.static.outputs.stack == 'python' || needs.static.outputs.stack == 'mixed'
        uses: astral-sh/setup-uv@v3

      - name: Run tests
        shell: bash
        run: |
          set +e
          case "${{ needs.static.outputs.stack }}" in
            pnpm|npm)
              pnpm test -- --run --reporter=default 2>&1 | tail -40
              ;;
            python)
              uv run pytest -q --tb=line 2>&1 | tail -40
              ;;
            docs) echo "no tests for docs-only change"; exit 0 ;;
            *) echo "no tests configured"; exit 0 ;;
          esac

  # 3. AI REVIEW — MiniMax M3 by default; skip if CodeRabbit already reviewed.
  # Note: this job does NOT checkout the repo — it only needs GitHub API access.
  ai-review:
    name: ai-review (${{ inputs.llm_provider }})
    needs: static
    if: inputs.enable_ai_review && !inputs.draft_pr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      MINIMAX_BASE_URL: ${{ secrets.MINIMAX_BASE_URL }}
    steps:
      - name: Skip if CodeRabbit already covered this PR
        if: inputs.skip_if_coderabbit
        id: cr
        shell: bash
        run: |
          CR=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json comments \
            -q '.comments[] | select(.body | test("@coderabbit|CodeRabbit|coderabbitai"; "i")) | .body' \
            2>/dev/null | head -1)
          if [ -n "$CR" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "CodeRabbit already reviewed — skipping MiniMax review"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: MiniMax M3 review
        if: steps.cr.outputs.skip != 'true'
        uses: actions/github-script@v7

  # 4. AUTO-FIX — open a side branch when tests/lint fail (HITL by default).
  auto-fix:
    name: auto-fix (HITL via side branch)
    needs: [static, tests]
    if: inputs.enable_auto_fix && failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Detect failing job + extract log
        id: capture
        shell: bash
        run: |
          RUN_ID="${{ github.event.workflow_run.id || github.run_id }}"
          gh run view "$RUN_ID" --log-failed > /tmp/failed.log 2>/dev/null || true
          head -c 4000 /tmp/failed.log > /tmp/failed.log.head
          echo "captured=$(wc -c < /tmp/failed.log | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Open auto-fix branch + MiniMax attempt
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="auto/fix-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          node scripts/auto-fix-attempt.js "$BRANCH" || {
            echo "Auto-fix could not produce a confident change — posting comment only."
            gh pr comment "$PR_NUMBER" --body \
              "🤖 **gatling auto-fix skipped** — failure was structural or model couldn't agree on a minimal fix. See run ${{ github.run_id }} for logs."
            exit 0
          }
          gh pr create \
            --base "$HEAD_REF" \
            --head "$BRANCH" \
            --title "🤖 auto-fix attempt for $PR_TITLE" \
            --body "Auto-generated fix attempt. **Do not merge without human review.** Run: ${{ github.run_id }}" \
            --draft || gh pr edit "$PR_NUMBER" --add-label "auto-fix-attempt"

  # 5. SUMMARY — single comment with the verdict so the PR is readable.
  summary:
    name: summary
    needs: [static, tests, ai-review, auto-fix]
    if: always()
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Post summary comment
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## 🐦‍⬛ gatling summary"
            echo ""
            echo "| job | result |"
            echo "|---|---|"
            echo "| static | ${{ needs.static.result }} |"
            echo "| tests | ${{ needs.tests.result }} |"
            echo "| ai-review | ${{ needs.ai-review.result }} |"
            echo "| auto-fix | ${{ needs.auto-fix.result }} |"
            echo ""
            echo "Run: ${{ github.run_id }}"
          } > /tmp/summary.md
          gh pr comment "$PR_NUMBER" --body "$(cat /tmp/summary.md)" || true
