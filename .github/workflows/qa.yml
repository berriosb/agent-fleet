# pre-push-qa — QA reusable workflow.
# This file lives in the central repo (berriosb/agent-fleet).
# Consumer repos invoke it via:
#   uses: berriosb/agent-fleet/.github/workflows/qa.yml@v1

name: pre-push-qa

on:
  workflow_call:
    inputs:
      stack:
        description: "Detected stack: python | pnpm | npm | mixed | terraform | docs | auto"
        required: false
        type: string
        default: "auto"
      enable_ai_review:
        description: "Run AI PR review (uses MiniMax M3 by default)"
        required: false
        type: boolean
        default: true
      enable_auto_fix:
        description: "Open a fix attempt branch when lint/tests fail (HITL)"
        required: false
        type: boolean
        default: true
      llm_provider:
        description: "Which OpenAI-compatible endpoint hosts the AI review. 'minimax' uses your MiniMax M3 subscription (default); 'anthropic' / 'openai' / 'gemini' need the matching API key as a repo secret."
        required: false
        type: string
        default: "minimax"
      skip_if_coderabbit:
        description: "If CodeRabbit has already reviewed, skip the AI review to save tokens"
        required: false
        type: boolean
        default: true
      draft_pr:
        description: "Is this run for a draft PR? (passed via consumer workflow; defaults to false)"
        required: false
        type: boolean
        default: false
    secrets:
      MINIMAX_API_KEY:
        required: false
      MINIMAX_BASE_URL:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      GOOGLE_API_KEY:
        required: false
      CODERABBIT_API_KEY:
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

concurrency:
  group: pre-push-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 1. STATIC — lint + typecheck + build, rapidos y gratis.
  #
  # El runner (skills/pre-push-qa/scripts/run.sh) es la UNICA implementacion del
  # gate: la CI lo invoca en vez de reimplementar la deteccion de stack y los
  # comandos. La copia que tenia aqui dejo de failar — todo lint terminaba en
  # `|| true`, y los tests iban por `... | tail`, que devuelve el codigo de
  # `tail` y no el del test. Local y remoto aplican los mismos criterios.
  static:
    name: lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      stack: ${{ steps.detect.outputs.stack }}
    steps:
      - name: Checkout caller code
        uses: actions/checkout@v7

      - name: Checkout QA scripts
        uses: actions/checkout@v7
        with:
          repository: berriosb/agent-fleet
          ref: v1
          path: .pre-push-qa
          sparse-checkout: skills/pre-push-qa

      - name: Detect stack
        id: detect
        shell: bash
        run: |
          set -eo pipefail
          if [ "${{ inputs.stack }}" != "auto" ] && [ -n "${{ inputs.stack }}" ]; then
            echo "stack=${{ inputs.stack }}" >> "$GITHUB_OUTPUT"
          else
            stack=$(bash .pre-push-qa/skills/pre-push-qa/scripts/run.sh --detect)
            echo "stack=$stack" >> "$GITHUB_OUTPUT"
          fi

      - name: Install hadolint
        if: steps.detect.outputs.stack == 'docker'
        shell: bash
        run: |
          if ! command -v hadolint > /dev/null; then
            echo "Installing hadolint (Dockerfile linter)..."
            sudo apt-get update -qq && sudo apt-get install -y -qq hadolint
          fi

      - name: Setup pnpm
        if: contains(fromJSON('["pnpm","npm","yarn","bun","mixed"]'), steps.detect.outputs.stack)
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Python (uv)
        if: contains(fromJSON('["python","pip","mixed"]'), steps.detect.outputs.stack)
        uses: astral-sh/setup-uv@v7

      - name: Setup Python (system)
        if: steps.detect.outputs.stack == 'pip'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          set -eo pipefail
          case "${{ steps.detect.outputs.stack }}" in
            pnpm)
              pnpm install --frozen-lockfile --ignore-scripts
              ;;
            yarn)
              yarn install --frozen-lockfile --ignore-scripts
              ;;
            bun)
              bun install --frozen-lockfile --ignore-scripts
              ;;
            npm)
              npm ci --ignore-scripts || npm install --ignore-scripts
              ;;
            python)
              if [ -f uv.lock ] || [ -f pyproject.toml ]; then
                uv sync --frozen 2>/dev/null || uv sync
              else
                # Repo Python sin manifiesto: no hay entorno de proyecto. Se
                # instalan las herramientas sueltas para que el gate tenga algo
                # que correr.
                pip install --quiet ruff mypy pytest
              fi
              ;;
            pip)
              pip install --quiet -r requirements.txt
              pip install --quiet ruff mypy pytest
              ;;
            *)
              echo "no dependency install for stack ${{ steps.detect.outputs.stack }}"
              ;;
          esac

      - name: Run static gate
        shell: bash
        run: bash .pre-push-qa/skills/pre-push-qa/scripts/run.sh --scope static

  # 2. TESTS — unit/integration.
  tests:
    name: tests
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout caller code
        uses: actions/checkout@v7

      - name: Checkout QA scripts
        uses: actions/checkout@v7
        with:
          repository: berriosb/agent-fleet
          ref: v1
          path: .pre-push-qa
          sparse-checkout: skills/pre-push-qa

      - name: Setup pnpm
        if: contains(fromJSON('["pnpm","npm","yarn","bun","mixed"]'), needs.static.outputs.stack)
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Python (uv)
        if: contains(fromJSON('["python","pip","mixed"]'), needs.static.outputs.stack)
        uses: astral-sh/setup-uv@v7

      - name: Setup Python (system)
        if: needs.static.outputs.stack == 'pip'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          set -eo pipefail
          case "${{ needs.static.outputs.stack }}" in
            pnpm)
              pnpm install --frozen-lockfile --ignore-scripts
              ;;
            yarn)
              yarn install --frozen-lockfile --ignore-scripts
              ;;
            bun)
              bun install --frozen-lockfile --ignore-scripts
              ;;
            npm)
              npm ci --ignore-scripts || npm install --ignore-scripts
              ;;
            python)
              if [ -f uv.lock ] || [ -f pyproject.toml ]; then
                uv sync --frozen 2>/dev/null || uv sync
              else
                pip install --quiet ruff mypy pytest
              fi
              ;;
            pip)
              pip install --quiet -r requirements.txt
              pip install --quiet ruff mypy pytest
              ;;
            *)
              echo "no dependency install for stack ${{ needs.static.outputs.stack }}"
              ;;
          esac

      - name: Run test gate
        shell: bash
        run: bash .pre-push-qa/skills/pre-push-qa/scripts/run.sh --scope tests

  # 3. AI REVIEW — Multi-provider (MiniMax M3 default, Anthropic, OpenAI, Gemini).
  ai-review:
    name: ai-review (${{ inputs.llm_provider }})
    needs: static
    if: inputs.enable_ai_review && github.event.pull_request.number != '' && !inputs.draft_pr
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      LLM_PROVIDER: ${{ inputs.llm_provider }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      MINIMAX_BASE_URL: ${{ secrets.MINIMAX_BASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Checkout caller code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout QA scripts
        uses: actions/checkout@v7
        with:
          repository: berriosb/agent-fleet
          ref: v1
          path: .pre-push-qa
          sparse-checkout: skills/pre-push-qa

      - name: Skip if CodeRabbit already covered this PR
        if: inputs.skip_if_coderabbit
        id: cr
        shell: bash
        run: |
          CR_COMMENT=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json comments \
            -q '.comments[] | select(.body | test("@coderabbit|CodeRabbit|coderabbitai"; "i")) | .body' \
            2>/dev/null | head -1 || true)
          CR_REVIEW=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json reviews \
            -q '.reviews[] | select(.author.login | test("coderabbit"; "i")) | .body' \
            2>/dev/null | head -1 || true)
          if [ -n "$CR_COMMENT" ] || [ -n "$CR_REVIEW" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "CodeRabbit already reviewed — skipping AI review"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture PR Diff
        if: steps.cr.outputs.skip != 'true'
        shell: bash
        run: |
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            git diff "$BASE_SHA...$HEAD_SHA" > /tmp/pr.diff 2>/dev/null || git diff "$BASE_SHA" "$HEAD_SHA" > /tmp/pr.diff 2>/dev/null || true
          fi
          if [ ! -s /tmp/pr.diff ] && [ -n "$PR_NUMBER" ]; then
            gh pr diff "$PR_NUMBER" --repo "$REPO" > /tmp/pr.diff 2>/dev/null || true
          fi
          if [ ! -s /tmp/pr.diff ]; then
            git diff HEAD~1 > /tmp/pr.diff 2>/dev/null || true
          fi
          echo "Captured diff lines: $(wc -l < /tmp/pr.diff 2>/dev/null || echo 0)"

      - name: Run AI Review
        if: steps.cr.outputs.skip != 'true'
        shell: bash
        run: |
          if [ -f scripts/review-call.js ]; then
            node scripts/review-call.js
          elif [ -f .pre-push-qa/skills/pre-push-qa/scripts/review-call.js ]; then
            node .pre-push-qa/skills/pre-push-qa/scripts/review-call.js
          else
            echo "No review script found — skipping."
          fi

  # 4. AUTO-FIX — open a side branch when tests/lint fail (HITL by default).
  auto-fix:
    name: auto-fix (HITL via side branch)
    needs: [static, tests]
    if: inputs.enable_auto_fix && failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      PR_TITLE: ${{ github.event.pull_request.title || github.event.head_commit.message || 'Direct push to main' }}
      REPO: ${{ github.repository }}
      LLM_PROVIDER: ${{ inputs.llm_provider }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      MINIMAX_BASE_URL: ${{ secrets.MINIMAX_BASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - name: Checkout caller code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Checkout QA scripts
        uses: actions/checkout@v7
        with:
          repository: berriosb/agent-fleet
          ref: v1
          path: .pre-push-qa
          sparse-checkout: skills/pre-push-qa

      - name: Detect failing job + extract log
        id: capture
        shell: bash
        run: |
          RUN_ID="${{ github.run_id }}"
          gh run view "$RUN_ID" --log-failed > /tmp/failed.log 2>/dev/null || true
          head -c 4000 /tmp/failed.log > /tmp/failed.log.head
          echo "captured=$(wc -c < /tmp/failed.log 2>/dev/null | tr -d ' ' || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Run Auto-Fix Attempt
        shell: bash
        run: |
          BRANCH="auto/fix-${{ github.run_id }}"
          if [ -f scripts/auto-fix-attempt.js ]; then
            node scripts/auto-fix-attempt.js "$BRANCH"
          elif [ -f .pre-push-qa/skills/pre-push-qa/scripts/auto-fix-attempt.js ]; then
            node .pre-push-qa/skills/pre-push-qa/scripts/auto-fix-attempt.js "$BRANCH"
          else
            echo "No auto-fix script found — skipping."
          fi

  # 5. SUMMARY — writes to GitHub Step Summary and comments on PR if available.
  summary:
    name: summary
    needs: [static, tests, ai-review, auto-fix]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Post summary
        shell: bash
        run: |
          {
            echo "## Pre-Push QA Summary"
            echo ""
            echo "| job | result |"
            echo "|---|---|"
            echo "| static | ${{ needs.static.result }} |"
            echo "| tests | ${{ needs.tests.result }} |"
            echo "| ai-review | ${{ needs.ai-review.result }} |"
            echo "| auto-fix | ${{ needs.auto-fix.result }} |"
            echo ""
            echo "Branch / Ref: \`${{ github.ref_name }}\`"
            echo "Run ID: ${{ github.run_id }}"
          } > /tmp/summary.md

          # Always output to GitHub Actions Job Summary (renders on push to main and PRs)
          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"

          # If triggered by a PR, also post comment to PR thread
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body "$(cat /tmp/summary.md)" || true
          fi
