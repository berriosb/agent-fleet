# mypy.ini — configuracion del type checker del repo.
#
# El repo no tiene manifiesto de Python: son scripts sueltos con stdlib. mypy se
# corre igual, porque encuentra los errores de tipo que ruff no ve (por ejemplo,
# un dict sin tipar al que se le hacen llamadas).
#
# `ignore_missing_imports` porque los imports son de la stdlib y de nada mas.
[mypy]
ignore_missing_imports = True
